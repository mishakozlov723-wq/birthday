<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="description" content="Одно очень личное поздравление от сына.">
<title>Мам, это тебе</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Onest,sans-serif;color:#292329;background:#fff;font-synthesis:none;--pink:#f9dce7;--accent:#ac416a}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #ac416a;outline-offset:6px}header{position:absolute;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:34px 48px;font-size:14px;font-weight:500;z-index:2}.brand{display:flex;gap:10px;align-items:center}.dot{width:8px;height:8px;background:#c15b81;border-radius:50%}.header-note{color:#777078}main{min-height:100svh;display:grid;place-items:center;padding:112px 24px 110px;overflow:hidden}.scene{text-align:center;width:100%;max-width:1020px;animation:arrive .7s ease both}.eyebrow{font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:#94526b;font-weight:500;margin:0 0 28px}h1{font-size:clamp(48px,6.7vw,88px);line-height:1.07;letter-spacing:-.065em;font-weight:600;margin:0}h1 .pink{color:#b84d77}.line{display:block}.stage{position:relative;width:min(620px,100%);height:200px;margin:38px auto 0}.yes{position:absolute;left:calc(50% - 124px);top:16px;width:176px;height:84px;border:0;border-radius:18px;background:var(--pink);color:#692c46;font-size:29px;font-weight:600;transition:left .22s ease,top .22s ease,transform .2s ease,background .2s ease;z-index:2}.yes:hover{background:#f5cddb}.no{position:absolute;left:calc(50% + 81px);top:36px;min-width:52px;min-height:44px;border:0;background:none;color:#777078;font-size:15px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#c8bdc3}.hint{min-height:24px;margin:0;color:#82767e;font-size:14px}.footer{position:absolute;bottom:30px;left:48px;right:48px;display:flex;justify-content:space-between;font-size:14px;color:#82767e}.footer .heart{color:#b84d77}.reply{font-size:18px;color:#766a72;line-height:1.6;margin:26px auto 0;max-width:380px}.continue{border:0;border-radius:14px;background:var(--pink);color:#692c46;padding:20px 28px;font-weight:500;font-size:16px;margin-top:32px}.note{font-size:14px;color:#82767e;margin-top:30px}.scene[hidden]{display:none}.celebration{color:#b84d77}.particle{position:fixed;pointer-events:none;top:-20px;width:8px;height:13px;animation:fall 2.4s ease-in forwards;z-index:5}@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(540deg);opacity:0}}@media(max-width:600px){header{padding:24px}.header-note{font-size:12px}h1{font-size:clamp(44px,11.4vw,64px);letter-spacing:-.06em}.eyebrow{font-size:12px;margin-bottom:24px}.stage{margin-top:30px;height:190px}.yes{height:76px;width:156px;left:calc(50% - 110px)}.no{left:calc(50% + 65px);top:32px}.footer{left:24px;right:24px;bottom:24px;font-size:12px}.reply{font-size:17px}.continue{padding:18px 22px;font-size:15px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.particle{display:none}}
</style>
</head>
<body>
<header><div class="brand"><span class="dot" aria-hidden="true"></span>мам, это тебе</div><span class="header-note">от сына, с любовью</span></header>
<main>
<section class="scene" id="intro" aria-labelledby="question">
<p class="eyebrow">У меня кое-что для тебя</p>
<h1 id="question"><span class="line">Мам, принять</span><span class="line pink">поздравление?</span></h1>
<div class="stage" id="stage"><button class="yes" id="yes">ДА</button><button class="no" id="no">нет</button></div>
<p class="hint" id="hint" aria-live="polite"></p>
</section>
<section class="scene" id="refusal" hidden aria-labelledby="refusalTitle"><p class="eyebrow">Так, стоп.</p><h1 id="refusalTitle">В смысле <span class="pink">«нет»?</span></h1><p class="reply">Вообще-то сын старался.</p><button class="continue" id="continue">Ладно, давай поздравление</button></section>
<section class="scene" id="accepted" hidden aria-labelledby="acceptedTitle"><p class="eyebrow">Вот и договорились</p><h1 id="acceptedTitle"><span class="line">С днём рождения,</span><span class="line pink">мам.</span></h1><p class="reply">Люблю тебя. Очень.</p><p class="note">Продолжение готовит твой сын.</p></section>
</main>
<footer class="footer"><span>одно особенное поздравление</span><span>только для тебя <span class="heart" aria-hidden="true">♡</span></span></footer>
<script>
const $=id=>document.getElementById(id);let attempts=0,lastMove=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function dodge(e){if(e.pointerType==='touch')e.preventDefault();const now=Date.now();if(now-lastMove<180)return;lastMove=now;attempts++;const stage=$('stage'),btn=$('yes'),w=stage.clientWidth-btn.offsetWidth;const positions=[[0,102],[1,108],[.1,0],[.9,0],[.46,112]];let [x,y]=positions[(attempts-1)%positions.length];btn.style.left=Math.round(w*x)+'px';btn.style.top=y+'px';$('hint').textContent=attempts<3?'':attempts<5?'Что-то «да» сегодня не в настроении.':'Ладно, попробуй «нет».';}
$('yes').addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'&&e.pointerType!=='')dodge(e)});
$('yes').addEventListener('pointerdown',e=>{e.preventDefault();dodge(e)});
$('yes').addEventListener('click',e=>{if(e.detail===0){show('accepted');confetti()}else dodge(e)});
function show(id){for(const name of ['intro','refusal','accepted'])$(name).hidden=name!==id;const title=$(id).querySelector('h1');title.tabIndex=-1;title.focus({preventScroll:true})}
$('no').onclick=()=>show('refusal');$('continue').onclick=()=>{show('accepted');confetti()};
function confetti(){if(reduce)return;for(let i=0;i<45;i++){const p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'vw';p.style.background=['#edb1c8','#f8dce6','#b84d77','#e6cdb0'][i%4];p.style.setProperty('--drift',(Math.random()-.5)*220+'px');p.style.animationDelay=Math.random()*.6+'s';p.style.borderRadius=i%3?'2px':'50%';document.body.append(p);setTimeout(()=>p.remove(),3200)}}
</script>
</body></html>
